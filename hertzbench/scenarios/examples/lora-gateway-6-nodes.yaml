# One LoRa gateway and six sensor nodes 300 m apart in a line, out to 1.8 km.
# Every board is an ESP32 running real firmware (fw/lora-gateway, fw/lora-node)
# with arduino-LoRa driving an SX1276 on VSPI; hertzbench models the SX1276 at
# its SPI registers (fidelity F1), so the binary is the one you would flash.
#
#   cd hertzbench && deno task hertzbench run scenarios/examples/lora-gateway-6-nodes.yaml
#
# Needs libqemu-xtensa, the ESP-IDF toolchain, the LoRa library and the worker
# patch for radio_spi; see docs/e2e-lora.md. lora-gateway-6-scripted.yaml is
# the same experiment with scripted boards, which runs anywhere.
#
# Urban path loss, no shadowing, 14 dBm, SF7 BW125 CR4/5: node-1 to node-3
# reach the gateway, node-4 (1.2 km) is on the edge, node-5 and node-6 do not.
# Unlike the scripted run, the nodes pick their own timing, so two packets can
# collide now and then; collisions show up as their own drop reason.
name: lora-gateway-6-nodes
seed: 7
# Boot and LoRa.begin() count toward the duration.
duration: 90s
environment:
  preset: urban
  shadowing_sigma_db: 0
nodes:
  - id: gw
    board: esp32
    firmware: ./fw/lora-gateway
    position: [0, 0]
    radios:
      - phy: lora
        frequency_mhz: 868.1
        sf: 7
        bw_khz: 125
        cr: 4/5
        tx_power_dbm: 14
        pins: { cs: 5, reset: 14, dio0: 26 }
  - id: node
    count: 6
    board: esp32
    firmware: ./fw/lora-node
    position: { grid: { origin: [300, 0], step: [300, 0] } }
    radios:
      - phy: lora
        frequency_mhz: 868.1
        sf: 7
        bw_khz: 125
        cr: 4/5
        tx_power_dbm: 14
        pins: { cs: 5, reset: 14, dio0: 26 }
assertions:
  - serial: { node: gw, contains: "lora gateway ready", within: 30s }
  - serial: { node: gw, contains: 'rx "reading:', within: 60s }
  - metric: { link: "node-1->gw", kind: lora, loss_pct: { lt: 20 } }
  - metric: { link: "node-6->gw", kind: lora, loss_pct: { eq: 100 } }
