name: Hertzbench Release

# A v* tag builds the standalone binaries and attaches them, with SHA256SUMS,
# to a GitHub Release. The lint, type check and tests must pass on Linux,
# macOS and Windows first.
on:
  push:
    tags: ['v*']

jobs:
  checks:
    uses: ./.github/workflows/hertzbench-ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hertzbench
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # deno compile cross-compiles: one Linux runner builds all six targets.
      - name: Build binaries
        run: deno task compile

      - name: Smoke test the Linux x64 binary
        run: ./dist/hertzbench-linux-x64 validate scenarios/examples/udp-3-scripted.yaml

      - name: Checksums
        working-directory: hertzbench/dist
        run: sha256sum hertzbench-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hertzbench-* dist/SHA256SUMS --title "Hertzbench $GITHUB_REF_NAME" --generate-notes

  # Unsigned disk images for macOS. They are not notarized, so Gatekeeper still
  # asks: right-click the binary and choose Open, or clear the quarantine flag
  # (see INSTALL.txt inside the image).
  dmg:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Build disk images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'hertzbench-macos-*' --pattern SHA256SUMS
          for arch in arm64 x64; do
            stage="stage-$arch"
            mkdir "$stage"
            install -m 0755 "hertzbench-macos-$arch" "$stage/hertzbench"
            cat > "$stage/INSTALL.txt" <<TXT
          Hertzbench $GITHUB_REF_NAME for macOS ($arch)

          This build is not signed or notarized. To install it:

            sudo cp /Volumes/Hertzbench/hertzbench /usr/local/bin/
            sudo xattr -d com.apple.quarantine /usr/local/bin/hertzbench
            hertzbench --help
          TXT
            hdiutil create -volname Hertzbench -srcfolder "$stage" -format UDZO -ov "hertzbench-macos-$arch.dmg"
          done
          shasum -a 256 hertzbench-macos-*.dmg >> SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" hertzbench-macos-*.dmg
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" SHA256SUMS --clobber
