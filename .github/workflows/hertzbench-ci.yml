name: Hertzbench CI

on:
  push:
    branches: [master, main]
    paths: ['hertzbench/**', '.github/workflows/hertzbench-*.yml']
  pull_request:
    branches: [master, main]
    paths: ['hertzbench/**', '.github/workflows/hertzbench-*.yml']
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: hertzbench
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The compile-helper and SPI-link tests run Python (python3 on Linux and
      # macOS, python on Windows).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test
